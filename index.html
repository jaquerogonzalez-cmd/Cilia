<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cilia Beta 1.4 · Orientación auditiva</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f8;--card:#fff;--ink:#12303a;--mute:#5b7480;--line:#d5e2e6;--accent:#1f7a8c;--accent-ink:#fff;--user:#1f7a8c;--user-ink:#fff;--urg:#b3261e;--urg-bg:#fdecea;--rev:#8a5a00;--rev-bg:#fff4d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1f;--card:#16272e;--ink:#e4eff2;--mute:#8fa8b2;--line:#2a414a;--accent:#4fb3c6;--accent-ink:#06222a;--user:#2a6f7e;--user-ink:#fff;--urg:#ff9d94;--urg-bg:#3a1b19;--rev:#ffd27a;--rev-bg:#3a2e12}}
:root[data-theme="dark"]{--bg:#0e1a1f;--card:#16272e;--ink:#e4eff2;--mute:#8fa8b2;--line:#2a414a;--accent:#4fb3c6;--accent-ink:#06222a;--user:#2a6f7e;--user-ink:#fff;--urg:#ff9d94;--urg-bg:#3a1b19;--rev:#ffd27a;--rev-bg:#3a2e12}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;height:100%;overflow:hidden;display:flex;flex-direction:column}
header{flex:none;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.hd{max-width:640px;margin:auto;display:flex;align-items:baseline;gap:10px}
h1{font-size:20px;margin:0;font-weight:700}
.hd span{color:var(--mute);font-size:14px}
#bar{height:3px;background:var(--line);margin-top:10px;max-width:640px;margin-inline:auto;border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
#wrap{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#log{max-width:640px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.usr{background:var(--user);color:var(--user-ink);border-bottom-right-radius:4px;align-self:flex-end}
.warn{background:var(--urg-bg);color:var(--urg);border-color:var(--urg);font-weight:500}
#ctl{flex:none;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
#ctl>div{max-width:640px;margin:auto;display:flex;flex-wrap:wrap;gap:8px}
button,input{font:inherit;color:inherit}
button{border:1px solid var(--accent);background:transparent;color:var(--accent);padding:9px 16px;border-radius:999px;cursor:pointer;text-align:left}
button:hover{background:var(--accent);color:var(--accent-ink)}
button.p{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.rep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
.rep h2{font-size:17px;margin:0 0 4px}
.rep h3{font-size:15px;margin:16px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.rep dl{margin:0;display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:3px 12px;font-size:15px}
.rep dt{color:var(--mute)}.rep dd{margin:0}
.al{padding:8px 12px;border-radius:8px;margin:6px 0;font-size:15px}
.U{background:var(--urg-bg);color:var(--urg)}.R{background:var(--rev-bg);color:var(--rev)}
.note{color:var(--mute);font-size:13px}
.by{max-width:640px;margin:10px auto 0;text-align:center;color:var(--mute);font-size:12px}
.v{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px;align-self:center}
.ghost{margin-left:auto;border-color:transparent;color:var(--mute);text-decoration:underline}
.conf{color:var(--urg);border-color:var(--urg);text-decoration:none}
.sel,.sel:hover{background:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:default}
button:disabled:hover{background:var(--accent);color:var(--accent-ink)}
.back{margin-left:auto;border-color:var(--line);color:var(--mute)}
#trp{display:none;max-width:640px;margin:auto;padding:16px}
#trp h2{font-size:17px;margin:0 0 4px}
.tl{padding:4px 0;white-space:pre-wrap}
.tl.u{color:var(--accent)}
.m,.tl,.rep dl,.al{break-inside:avoid;page-break-inside:avoid}
.rep h3{break-after:avoid;page-break-after:avoid}
@media print{
:root:root:root{--bg:#fff;--card:#fff;--ink:#111;--mute:#444;--line:#bbb;--accent:#0b4f5c;--urg:#8c1d18;--urg-bg:#fdecea;--rev:#6b4500;--rev-bg:#fff4d6}
header,#ctl{display:none}html,body{height:auto;overflow:visible}#wrap{overflow:visible}
body.ps #log>.m{display:none}
body.pt #wrap{display:none}body.pt #trp{display:block}}
</style>
</head>
<body>
<header><div class="hd"><h1>Cilia</h1><em class="v">Beta 1.4</em><span>Orientación auditiva y del equilibrio</span></div><div id="bar"><i></i></div></header>
<main id="wrap"><div id="log" aria-live="polite"></div></main>
<div id="trp"></div>
<div id="ctl"><div id="in"></div><p class="by">by Rodrigo Jaque TM ORL</p></div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const N="131 (SAMU)",BACK=Symbol("back");
/* ESTADO: cada dato vive en una sección declarada. F sigue funcionando como acceso plano (F.hipo, F.rol...) pero escribe en su sección. */
const ESQ={
 paciente:["rol","quien","nombre","edad","edadTxt","sexo"],
 respuestas:["consent","rolsel","motivo","molsel","fastsel","motivo2","f1","f2","f3","f4","f5","f6","cont","lat","hipo","tin","ple","otr","otal","fie","mareo","mols","otra","vtipo","vdur","vfun","vfrec","vdes","vnau","ini","sub","subd","ruido","inf","cir","fam","med"],
 flujo:["evmot","fast","latAuto","nota","ev","interrumpido","adv","nivel","cierre","decision","fecha"]
};
const SEC={};Object.entries(ESQ).forEach(([sc,ks])=>ks.forEach(k=>SEC[k]=sc));
let E={paciente:{},respuestas:{},flujo:{},alertas:[]};
const F=new Proxy({},{
 get:(_,k)=>k==="alertas"?E.alertas:E[SEC[k]||"flujo"][k],
 set:(_,k,v)=>{if(!SEC[k])console.warn("Clave sin declarar en el estado:",k);E[SEC[k]||"flujo"][k]=v;return true},
 deleteProperty:(_,k)=>{delete E[SEC[k]||"flujo"][k];return true}
});
const guardar=()=>JSON.stringify(E),restaurar=j=>{E=JSON.parse(j)};
const YN=[["Sí",true],["No",false],["No sé",null]];
const fmt=v=>v===true?"Sí":v===false?"No":v===null?"No sabe / No responde":(v??"N/D");
const alerta=(n,t)=>F.alertas.push({nivel:n,detalle:t});
const pos=()=>F.alertas.filter(a=>a.nivel==="URGENTE"&&a.detalle.startsWith("BANDERA"));
const T=()=>F.rol==="tercero";
const TQ={mols:"¿Cuáles de estas molestias tiene la persona? Puedes marcar más de una.",molsel:"¿La persona tiene alguna molestia en este momento?",motivo:"Con tus palabras, ¿cuál es la molestia principal de la persona?",lat:"¿En qué oído la siente?",motivo2:"Cuéntame con tus palabras qué molestia tiene la persona.",fastsel:"Entiendo. Si no hay molestias, ¿la visita es por un control de rutina, calibrar audífonos o mostrar resultados de exámenes?",f1:"¿Notaste que dejó de escuchar de un momento a otro?",f2:"¿Notas que tiene un lado de la cara caído o débil?",f3:"¿Le cuesta hablar o entender lo que le dicen?",f4:"¿Se queja de ver doble?",f5:"¿Se queja de un dolor de cabeza muy intenso, distinto a los habituales?",f6:"¿Sufrió un golpe reciente en la cabeza?",hipo:"¿Has notado que escucha menos? (por ejemplo, sube el volumen o pide que le repitan)",tin:"¿Se queja de zumbidos, pitidos o ruidos en el oído?",ple:"¿Se queja de tener el oído tapado o lleno?",otr:"¿Has visto salir líquido, pus o sangre de su oído?",otal:"¿Se queja de dolor de oído?",fie:"¿Ha tenido fiebre en los últimos días?",mareo:"¿Has notado que pierde el equilibrio, se tambalea, se queja de mareo o se ha caído?",vfun:"¿El mareo le impide caminar solo, o lo obliga a quedarse acostado?",vdes:"¿Has notado si el mareo aparece al acostarse, levantarse rápido o mover la cabeza? (Si no lo sabes, escribe «No lo sé»)",vnau:"¿Ha tenido náuseas o vómitos con el mareo?",ini:"¿Hace cuánto notaste estos problemas? (días, meses o años)",sub:"¿Los problemas aparecieron de forma repentina, de un momento a otro?",ruido:"¿Sabes si ha estado expuesto a ruidos muy fuertes, recientemente o por su trabajo?",inf:"¿Sabes si tiene historial de infecciones frecuentes en los oídos?",cir:"¿Sabes si le han hecho alguna cirugía en los oídos?",fam:"¿Sabes si alguien en su familia directa tiene pérdida de audición importante?",med:"¿Sabes si toma algún medicamento de forma regular? Menciona antibióticos por vena, quimioterapia o aspirina en dosis altas. (Si no, escribe «Ninguno» o «No lo sé»)"};
const OTO=[["gentamicina","gentamic"],["amikacina","amikac"],["vancomicina","vancomic"],["cisplatino","cisplat"],["quimioterapia","quimio"],["intravenoso","intraven"],["endovenoso","endoven"],["aspirina","aspirin"],["furosemida","furosemid"]];
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function ototoxHit(txt){const toks=norm(txt).replace(/[^a-z ]/g," ").split(/\s+/).filter(x=>x.length>=5).map(x=>x.replace(/^kim/,"quim"));
 return OTO.filter(([w,r])=>toks.some(x=>x.startsWith(r)||lev(x,w)<=(w.length>=9?2:1))).map(([w])=>w)}
const norm=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const flag=(k,q,n)=>({k,t:"yn",q,noev:1,on:v=>{if(v===true)alerta("URGENTE","BANDERA ROJA: "+n+".");else if(v===null){if(T())alerta("REVISAR","No tiene claridad sobre: "+n+".");else if(F.rol==="yo")return"stopcog"}}});
const sint=(k,q)=>({k,t:"yn",q});
const mar=()=>F.mareo===true;
const S=[
{k:"consent",t:"yn",yn:2,pre:"¡Hola! Soy Cilia, asistente de salud auditiva. Te haré unas preguntas breves (3 a 5 minutos) para darte recomendaciones según lo que me cuentes. No soy médico ni entrego diagnósticos.\n\nTus respuestas no se guardan ni se envían a nadie: quedan solo en tu navegador mientras usas la página.",q:"¿Aceptas continuar bajo estas condiciones?",on:v=>v!==true?"stopsin":0},
{k:"rolsel",t:"opt",noev:1,o:["Para mí","Para otra persona (familiar o tercero)"],q:"Para guiarte mejor: ¿esta consulta es para ti o para otra persona?",on:v=>{F.rol=v==="Para mí"?"yo":"tercero";F.quien=F.rol==="yo"?"El propio paciente":"Un tercero en nombre del paciente"}},
{k:"nombre",t:"text",pre:()=>T()?"Empecemos por los datos del paciente.":"Empecemos por tus datos.",q:()=>T()?"¿Cuál es el nombre completo del paciente?":"¿Cuál es tu nombre completo?"},
{k:"edad",t:"age",q:()=>T()?"¿Qué edad tiene el paciente? (escribe el número y elige Años o Meses)":"¿Qué edad tienes? (escribe el número y elige Años; para bebés, Meses)",on:v=>{F.edad=v.a;F.edadTxt=v.t}},
{k:"sexo",t:"opt",o:["Femenino","Masculino","Otro / Prefiero no decir"],q:()=>T()?"¿Cuál es el sexo registrado al nacer del paciente?":"¿Cuál es tu sexo registrado al nacer?"},
{k:"motivo",t:"text",noev:1,pre:"Gracias. Ahora cuéntame lo que te trae.",q:"Con tus propias palabras, ¿cuál es la molestia principal?",on:v=>{const n=nn(v);if(!SYM.test(n.replace(NEG,""))&&(EVR.test(n)||FTR.test(n)))F.evmot=true;
 const d=/\bderech[oa]\b/.test(n),iz=/\bizquierd[oa]\b/.test(n),am=/\bambos\b|\bambas\b|\blos dos\b|\blos 2\b/.test(n);
 if(!/\b(no|nada|bien|normal|pero|sin)\b/.test(n)){const L=(am||(d&&iz))?"Ambos oídos":d?"Oído derecho":iz?"Oído izquierdo":null;if(L){F.lat=L;F.latAuto=true;F.nota="Anoté que lo sientes en: "+L.toLowerCase()+"."}}}},
{k:"molsel",t:"yn",noev:1,when:()=>F.evmot===true,q:"¿Tienes alguna molestia en este momento?"},
{k:"fastsel",t:"opt",noev:1,when:()=>F.evmot===true&&F.molsel===false,o:["Control de rutina","Revisar o calibrar mis audífonos","Mostrar resultados de exámenes","En realidad sí tengo una molestia"],q:"Entiendo. Si no tienes molestias, ¿vienes a un control de rutina, a calibrar tus audífonos o a mostrar resultados de exámenes?",on:v=>{F.fast=!v.startsWith("En realidad")}},
{k:"motivo2",t:"text",when:()=>(F.evmot===true&&F.molsel!==false)||F.fast===false,q:"Cuéntame con tus palabras qué molestia tienes."},
...[["f1","Ahora, unas preguntas de seguridad. ¿Has perdido la audición por completo, de un momento a otro?","Pérdida súbita de audición"],["f2","¿Sientes debilidad o caída en un lado de la cara?","Debilidad facial"],["f3","¿Tienes dificultad para hablar o para entender lo que te dicen?","Dificultad para hablar"],["f4","¿Tienes visión doble?","Visión doble"],["f5","¿Tienes un dolor de cabeza muy intenso, distinto a los que has tenido antes?","Cefalea intensa inusual"],["f6","¿Sufriste un golpe reciente en la cabeza?","Traumatismo craneal reciente"]].map(([k,q,n])=>flag(k,q,n)),
{k:"cont",t:"yn",yn:2,when:()=>pos().length>0,pre:()=>"⚠️ Por lo que me cuentas, es importante que te evalúen cuanto antes. Te recomiendo acudir hoy a un servicio de urgencias. Si necesitas ayuda inmediata, llama al "+N+".",q:"¿Quieres que igual te dé recomendaciones generales según el resto de tus respuestas?",on:v=>{F.decision="Se te recomendó acudir a urgencias; "+(v===true?"decidiste continuar con la orientación.":"decidiste no continuar.");F.adv=true;if(v!==true)return"stop"}},
{k:"mols",t:"multi",noev:1,pre:"Ahora cuéntame qué molestias hay, para preguntarte solo lo necesario.",o:[["otal","Dolor de oído"],["otr","Secreción o sangre"],["hipo","Escucho menos"],["tin","Zumbido o pitido"],["ple","Oído tapado o lleno"],["mareo","Mareo o inestabilidad"],["otra","Otra molestia"]],q:"¿Cuáles de estas molestias tienes? Puedes marcar más de una.",on:v=>{const sel=[...v];if(F.f1===true&&!sel.includes("hipo"))sel.push("hipo");F.mols=sel;["otal","otr","hipo","tin","ple","mareo"].forEach(k=>{if(sel.includes(k))F[k]=true})}},
{k:"otra",t:"text",when:()=>(F.mols||[]).includes("otra"),q:"Cuéntame con tus palabras cuál es esa otra molestia."},
{k:"lat",t:"opt",o:["Oído derecho","Oído izquierdo","Ambos oídos"],q:"¿En qué oído la sientes?"},
sint("fie","¿Has tenido fiebre en los últimos días?"),
{k:"vtipo",t:"opt",when:()=>mar()&&!T(),o:["Siento que todo da vueltas (giro)","Inestabilidad al caminar","Siento que me voy a desmayar","Otro / No sé describirlo"],q:"¿Cómo describirías mejor el mareo?"},
{k:"vdur",t:"opt",when:mar,o:["Segundos","Minutos","Horas","Días","Constante","No sé decirlo"],q:"¿Cuánto dura el episodio más intenso?"},
{k:"vfun",t:"opt",when:()=>mar()&&(T()||/No sé/.test(F.vtipo||"")||F.vdur==="No sé decirlo"),o:["Puede caminar con normalidad","Camina con dificultad o necesita apoyo","No puede caminar solo","Debe quedarse acostado"],q:"Entiendo que es difícil describirlo. ¿Este mareo te impide caminar solo, o te obliga a quedarte acostado?",on:v=>{if(/solo|acostado/.test(v))alerta("REVISAR","Mareo con impacto funcional importante: "+v+".")}},
{k:"vfrec",t:"opt",when:mar,o:["Una sola vez","Pocas veces","Varias veces por semana","Todos los días"],q:"¿Cuántas veces te ha pasado?"},
{k:"vdes",t:"text",when:mar,q:"¿Algo lo provoca, como acostarte, levantarte rápido o mover la cabeza? (Si no, escribe «Nada»)"},
{k:"vnau",t:"yn",when:mar,q:"¿Vienen acompañados de náuseas o vómitos?"},
{k:"ini",t:"text",pre:"Ahora, sobre la evolución.",q:"¿Hace cuánto comenzaron estos problemas? (días, meses o años)"},
{k:"sub",t:"yn",q:"¿Empezó de forma repentina, de un momento a otro?",on:v=>{if(v===null)alerta("REVISAR","No sabe si el inicio fue súbito.")}},
{k:"subd",t:"opt",when:()=>F.sub===true,o:["La pérdida de audición","El mareo","Ambos"],q:"Lo que empezó de repente, ¿fue…?",on:v=>{alerta("REVISAR","Inicio súbito en: "+v+".");if(v!=="El mareo")alerta("URGENTE","Posible hipoacusia de inicio súbito: requiere evaluación prioritaria.")}},
{k:"ruido",t:"yn",pre:"Casi terminamos: antecedentes.",q:"¿Has estado expuesto a ruidos muy fuertes, recientemente o por tu trabajo?"},
{k:"inf",t:"yn",q:"¿Tienes historial de infecciones frecuentes en los oídos?"},
{k:"cir",t:"yn",q:"¿Te han hecho alguna cirugía en los oídos?"},
{k:"fam",t:"yn",q:"¿Hay alguien en tu familia directa con pérdida de audición importante?"},
{k:"med",t:"text",q:"¿Tomas algún medicamento de forma regular? Menciona si has recibido antibióticos por vena, quimioterapia o aspirina en dosis altas. (Si no, escribe «Ninguno»)",on:v=>{const f=ototoxHit(v);if(f.length)alerta("REVISAR","Tratamientos a revisar por posible ototoxicidad (detección automática: "+f.join(", ")+").")}}
];
S.forEach(x=>{if(!SEC[x.k])console.warn("Paso sin sección en el estado:",x.k)});
const KEEP=["consent","rolsel","nombre","edad","sexo","motivo","molsel","fastsel","motivo2","cir","med"];
S.forEach(s=>{if(!KEEP.includes(s.k)){const w=s.when;s.when=()=>!F.fast&&(!w||w())}});
S.find(s=>s.k==="cir").pre=()=>F.fast?"Perfecto, entonces solo necesito un par de datos más.":"";
const sk=(k,w)=>{const x=S.find(y=>y.k===k),o=x.when;x.when=()=>(!o||o())&&w()};
sk("sub",()=>F.f1!==true);sk("subd",()=>F.f1!==true);sk("lat",()=>!F.latAuto&&(F.mols||[]).some(c=>c!=="mareo"));
sk("fie",()=>F.otal===true||F.otr===true);sk("inf",()=>F.otal===true||F.otr===true||F.hipo===true);
sk("ruido",()=>F.hipo===true||F.tin===true);sk("fam",()=>F.hipo===true);
{const f1=S.find(x=>x.k==="f1"),o1=f1.on;f1.on=v=>{const r=o1(v);if(v===true){F.hipo=true;F.sub=true;F.subd="La pérdida de audición"}return r}}
function msg(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;$("#log").append(d);const w=$("#wrap");w.scrollTo({top:w.scrollHeight,behavior:"smooth"})}
async function say(t,c="bot"){await sleep(250);msg(t,c)}
function ask(s,back){return new Promise(res=>{
 const box=$("#in");box.innerHTML="";
 const done=(v,label)=>{msg(label,"usr");box.innerHTML="";res(v)};
 if(s.t==="yn")(s.yn===2?YN.slice(0,2):YN).forEach(([l,v])=>{const b=document.createElement("button");b.textContent=l;b.onclick=()=>done(v,l);box.append(b)});
 else if(s.t==="opt")s.o.forEach(o=>{const b=document.createElement("button");b.textContent=o;b.onclick=()=>done(o,o);box.append(b)});
 else if(s.t==="multi"){const sel=new Set(),c=document.createElement("button");c.textContent="Continuar";c.className="p";c.disabled=true;
  s.o.forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;b.setAttribute("aria-pressed","false");b.onclick=()=>{sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle("sel",sel.has(k));b.setAttribute("aria-pressed",String(sel.has(k)));c.disabled=!sel.size};box.append(b)});
  c.onclick=()=>{const ch=s.o.filter(([k])=>sel.has(k));done(ch.map(([k])=>k),ch.map(([,l])=>l).join(", "))};box.append(c)}
 else{const i=document.createElement("input"),b=document.createElement("button");
  i.type=s.t==="age"?"number":"text";i.autocomplete="off";i.placeholder=s.t==="age"?"Ej: 45":"Escribe aquí";b.textContent=s.t==="age"?"Años":"Enviar";b.className="p";
  const go=u=>{const v=i.value.trim();if(!v)return;
   if(s.t==="age"){const x=+v,okA=u==="a"&&Number.isInteger(x)&&x>=1&&x<=120,okM=u==="m"&&Number.isInteger(x)&&x>=0&&x<=11;
    if(!okA&&!okM){i.value="";i.placeholder=u==="m"?"Meses: de 0 a 11":"Años: de 1 a 120";return}
    const t=okA?x+(x===1?" año":" años"):x+(x===1?" mes":" meses");return done({a:okA?x:0,t},t)}
