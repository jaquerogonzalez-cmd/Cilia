<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cilia · Orientación auditiva</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f8;--card:#fff;--ink:#12303a;--mute:#5b7480;--line:#d5e2e6;--accent:#1f7a8c;--accent-ink:#fff;--user:#1f7a8c;--user-ink:#fff;--urg:#b3261e;--urg-bg:#fdecea;--rev:#8a5a00;--rev-bg:#fff4d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1f;--card:#16272e;--ink:#e4eff2;--mute:#8fa8b2;--line:#2a414a;--accent:#4fb3c6;--accent-ink:#06222a;--user:#2a6f7e;--user-ink:#fff;--urg:#ff9d94;--urg-bg:#3a1b19;--rev:#ffd27a;--rev-bg:#3a2e12}}
:root[data-theme="dark"]{--bg:#0e1a1f;--card:#16272e;--ink:#e4eff2;--mute:#8fa8b2;--line:#2a414a;--accent:#4fb3c6;--accent-ink:#06222a;--user:#2a6f7e;--user-ink:#fff;--urg:#ff9d94;--urg-bg:#3a1b19;--rev:#ffd27a;--rev-bg:#3a2e12}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;z-index:2}
.hd{max-width:640px;margin:auto;display:flex;align-items:baseline;gap:10px}
h1{font-size:20px;margin:0;font-weight:700}
.hd span{color:var(--mute);font-size:14px}
#bar{height:3px;background:var(--line);margin-top:10px;max-width:640px;margin-inline:auto;border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
main{flex:1;width:100%;max-width:640px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.usr{background:var(--user);color:var(--user-ink);border-bottom-right-radius:4px;align-self:flex-end}
.warn{background:var(--urg-bg);color:var(--urg);border-color:var(--urg);font-weight:500}
#ctl{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
#ctl>div{max-width:640px;margin:auto;display:flex;flex-wrap:wrap;gap:8px}
button,input{font:inherit;color:inherit}
button{border:1px solid var(--accent);background:transparent;color:var(--accent);padding:9px 16px;border-radius:999px;cursor:pointer;text-align:left}
button:hover{background:var(--accent);color:var(--accent-ink)}
button.p{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.rep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
.rep h2{font-size:17px;margin:0 0 4px}
.rep h3{font-size:15px;margin:16px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.rep dl{margin:0;display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:3px 12px;font-size:15px}
.rep dt{color:var(--mute)}.rep dd{margin:0}
.al{padding:8px 12px;border-radius:8px;margin:6px 0;font-size:15px}
.U{background:var(--urg-bg);color:var(--urg)}.R{background:var(--rev-bg);color:var(--rev)}
.note{color:var(--mute);font-size:13px}
.by{max-width:640px;margin:10px auto 0;text-align:center;color:var(--mute);font-size:12px}
@media print{header,#ctl{display:none}}
</style>
</head>
<body>
<header><div class="hd"><h1>Cilia</h1><span>Orientación auditiva y del equilibrio</span></div><div id="bar"><i></i></div></header>
<main id="log" aria-live="polite"></main>
<div id="ctl"><div id="in"></div><p class="by">by Rodrigo Jaque TM ORL</p></div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const F={alertas:[]},N="131 (SAMU)";
const YN=[["Sí",true],["No",false],["No sé",null]];
const fmt=v=>v===true?"Sí":v===false?"No":v===null?"No sabe / No responde":(v??"N/D");
const alerta=(n,t)=>F.alertas.push({nivel:n,detalle:t});
const pos=()=>F.alertas.filter(a=>a.nivel==="URGENTE"&&a.detalle.startsWith("BANDERA"));
const ototox=["gentamicina","amikacina","vancomicina","cisplatino","quimio","intravenos","endovenos","aspirina","furosemida"];
const norm=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const flag=(k,q,n)=>({k,t:"yn",q,on:v=>{if(v===true)alerta("URGENTE","BANDERA ROJA: "+n+".");else if(v===null)alerta("REVISAR","Respuesta incierta en: "+n+".")}});
const sint=(k,q)=>({k,t:"yn",q});
const mar=()=>F.mareo!==false;
const S=[
{k:"consent",t:"yn",yn:2,pre:"¡Hola! Soy Cilia, asistente de salud auditiva. Te haré unas preguntas breves (3 a 5 minutos) para darte recomendaciones según lo que me cuentes. No soy médico ni entrego diagnósticos.\n\nTus respuestas no se guardan ni se envían a nadie: quedan solo en tu navegador mientras usas la página.",q:"¿Aceptas continuar bajo estas condiciones?",on:v=>v!==true?"stopsin":0},
{k:"nombre",t:"text",pre:"Empecemos por tus datos.",q:"¿Cuál es tu nombre completo?"},
{k:"edad",t:"num",q:"¿Qué edad tienes?"},
{k:"sexo",t:"opt",o:["Femenino","Masculino","Otro / Prefiero no decir"],q:"¿Cuál es tu sexo registrado al nacer?"},
flag("f1","Ahora, unas preguntas de seguridad. ¿Has perdido la audición por completo, de un momento a otro?","Pérdida súbita de audición"),
flag("f2","¿Sientes debilidad o caída en un lado de la cara?","Debilidad facial"),
flag("f3","¿Tienes dificultad para hablar o para entender lo que te dicen?","Dificultad para hablar"),
flag("f4","¿Tienes visión doble?","Visión doble"),
flag("f5","¿Tienes un dolor de cabeza muy intenso, distinto a los que has tenido antes?","Cefalea intensa inusual"),
flag("f6","¿Sufriste un golpe reciente en la cabeza?","Traumatismo craneal reciente"),
{k:"cont",t:"yn",yn:2,when:()=>pos().length>0,pre:()=>"⚠️ Por lo que me cuentas, es importante que te evalúen cuanto antes. Te recomiendo acudir hoy a un servicio de urgencias. Si necesitas ayuda inmediata, llama al "+N+".",q:"¿Quieres que igual te dé recomendaciones generales según el resto de tus respuestas?",on:v=>{F.decision="Se te recomendó acudir a urgencias; "+(v===true?"decidiste continuar con la orientación.":"decidiste no continuar.");F.adv=true;if(v!==true)return"stop"}},
{k:"motivo",t:"text",pre:"Gracias. Ahora cuéntame lo que te trae.",q:"Con tus propias palabras, ¿cuál es la molestia principal?"},
{k:"lat",t:"opt",o:["Oído derecho","Oído izquierdo","Ambos oídos"],q:"¿En qué oído la sientes?"},
sint("hipo","Para entender mejor lo que sientes: ¿escuchas menos?"),
sint("tin","¿Escuchas algún zumbido, pito o ruido constante en el oído?"),
sint("ple","¿Sientes el oído tapado o lleno?"),
sint("otr","¿Ha salido líquido, supuración o sangre de tu oído?"),
sint("otal","¿Tienes dolor de oído?"),
sint("fie","¿Has tenido fiebre en los últimos días?"),
{k:"mareo",t:"yn",q:"¿Has sentido mareos, inestabilidad o la sensación de que tú o las cosas a tu alrededor giran?"},
{k:"vtipo",t:"opt",when:mar,o:["Siento que todo da vueltas (giro)","Inestabilidad al caminar","Siento que me voy a desmayar","Otro / No sé describirlo"],q:"¿Cómo describirías mejor el mareo?"},
{k:"vdur",t:"opt",when:mar,o:["Segundos","Minutos","Horas","Días","Constante"],q:"¿Cuánto dura el episodio más intenso?"},
{k:"vfrec",t:"opt",when:mar,o:["Una sola vez","Pocas veces","Varias veces por semana","Todos los días"],q:"¿Cuántas veces te ha pasado?"},
{k:"vdes",t:"text",when:mar,q:"¿Algo lo provoca, como acostarte, levantarte rápido o mover la cabeza? (Si no, escribe «Nada»)"},
{k:"vnau",t:"yn",when:mar,q:"¿Vienen acompañados de náuseas o vómitos?"},
{k:"ini",t:"text",pre:"Ahora, sobre la evolución.",q:"¿Hace cuánto comenzaron estos problemas? (días, meses o años)"},
{k:"sub",t:"yn",q:"¿Empezó de forma repentina, de un momento a otro?",on:v=>{if(v===null)alerta("REVISAR","No sabe si el inicio fue súbito.")}},
{k:"subd",t:"opt",when:()=>F.sub===true,o:["La pérdida de audición","El mareo","Ambos"],q:"Lo que empezó de repente, ¿fue…?",on:v=>{alerta("REVISAR","Inicio súbito en: "+v+".");if(v!=="El mareo")alerta("URGENTE","Posible hipoacusia de inicio súbito: requiere evaluación prioritaria.")}},
{k:"ruido",t:"yn",pre:"Casi terminamos: antecedentes.",q:"¿Has estado expuesto a ruidos muy fuertes, recientemente o por tu trabajo?"},
{k:"inf",t:"yn",q:"¿Tienes historial de infecciones frecuentes en los oídos?"},
{k:"cir",t:"yn",q:"¿Te han hecho alguna cirugía en los oídos?"},
{k:"fam",t:"yn",q:"¿Hay alguien en tu familia directa con pérdida de audición importante?"},
{k:"med",t:"text",q:"¿Tomas algún medicamento de forma regular? Menciona si has recibido antibióticos por vena, quimioterapia o aspirina en dosis altas. (Si no, escribe «Ninguno»)",on:v=>{const f=ototox.filter(p=>norm(v).includes(p));if(f.length)alerta("REVISAR","Tratamientos a revisar por posible ototoxicidad (detección automática: "+f.join(", ")+").")}}
];
function msg(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;$("#log").append(d);d.scrollIntoView({block:"end",behavior:"smooth"})}
async function say(t,c="bot"){await sleep(250);msg(t,c)}
function ask(s){return new Promise(res=>{
 const box=$("#in");box.innerHTML="";
 const done=(v,label)=>{msg(label,"usr");box.innerHTML="";res(v)};
 if(s.t==="yn")(s.yn===2?YN.slice(0,2):YN).forEach(([l,v])=>{const b=document.createElement("button");b.textContent=l;b.onclick=()=>done(v,l);box.append(b)});
 else if(s.t==="opt")s.o.forEach(o=>{const b=document.createElement("button");b.textContent=o;b.onclick=()=>done(o,o);box.append(b)});
 else{const i=document.createElement("input"),b=document.createElement("button");
  i.type=s.t==="num"?"number":"text";i.autocomplete="off";i.placeholder=s.t==="num"?"Ej: 45":"Escribe aquí";b.textContent="Enviar";b.className="p";
  const go=()=>{const v=i.value.trim();if(!v)return;if(s.t==="num"&&!(+v>=1&&+v<=120)){i.setCustomValidity("x");i.placeholder="Ingresa una edad entre 1 y 120";i.value="";return}done(s.t==="num"?+v:v,v)};
  b.onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go()};box.append(i,b);i.focus()}
})}
async function run(){
 let n=0;const tot=S.length;
 for(const s of S){
  n++;$("#bar i").style.width=(n/tot*100)+"%";
  if(s.when&&!s.when())continue;
  if(s.pre)await say(typeof s.pre==="function"?s.pre():s.pre,s.k==="cont"?"bot warn":"bot");
  await say(s.q);
  F[s.k]=await ask(s);
  const r=s.on&&s.on(F[s.k]);
  if(r==="stopsin"){await say("Entiendo. Si cambias de opinión, aquí estaré. ¡Que tengas un buen día!");return end(false)}
  if(r==="stop"){F.interrumpido=true;await say("Entiendo. Por ahora, lo más importante es que recibas atención. Que te mejores pronto.");return end(true)}
 }
 await say("¡Gracias! Con lo que me contaste, esto es lo que te recomiendo:");
 const urg=F.alertas.some(a=>a.nivel==="URGENTE");
 const pronto=F.sub===true||F.otr===true||F.fie===true||F.hipo===true||(mar()&&["Días","Constante"].includes(F.vdur));
 F.nivel=urg?"Acudir hoy a un servicio de urgencias":pronto?"Consultar con un otorrinolaringólogo en los próximos días":"Agendar una consulta de control con otorrino o una audiometría cuando puedas";
 await say("Orientación: "+F.nivel+".",urg?"bot warn":"bot");
 const t=["Evita introducir cotonitos en tus oídos: suelen empujar la cera hacia el fondo y pueden lastimar el conducto o el tímpano."];
 if(F.ruido!==false||F.tin!==false||F.hipo!==false)t.push("Reduce la exposición a ruidos fuertes y usa protección auditiva si no puedes evitarlos. Si usas audífonos o auriculares, mantén el volumen moderado.");
 if(F.otr!==false||F.otal!==false)t.push("Si tienes dolor o secreción (o no estás seguro), procura mantener el oído seco al bañarte.");
 if(mar())t.push("Cambia de postura con calma y evita conducir, subir a alturas o usar escaleras sin apoyo mientras tengas mareos.");
 if(F.tin===true)t.push("El zumbido suele notarse más en silencio: un sonido ambiente suave (ventilador, música baja) puede ayudarte a ratos.");
 if(F.alertas.some(a=>a.detalle.includes("ototoxicidad")))t.push("No suspendas ningún medicamento por tu cuenta; cuéntale tus tratamientos al médico que te atienda.");
 t.push("Para tu consulta, lleva la lista de tus medicamentos y cuándo comenzaron los síntomas. Abajo puedes copiar o imprimir tu resumen.");
 t.push("Si empeoras de golpe, o aparece debilidad en la cara, dificultad para hablar o pérdida brusca de audición, acude a urgencias o llama al "+N+".");
 await say(t.map(x=>"• "+x).join("\n"));end(true)
}
function end(rep){
 $("#bar i").style.width="100%";const box=$("#in");box.innerHTML="";
 const nb=document.createElement("button");nb.textContent="Nueva evaluación";nb.onclick=()=>location.reload();box.append(nb);
 if(!rep)return;
 F.fecha=new Date().toLocaleString("es-CL");
 const e=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 const sec=(t,rows)=>"<h3>"+t+"</h3><dl>"+rows.map(([l,k])=>"<dt>"+l+"</dt><dd>"+e(String(fmt(F[k])))+"</dd>").join("")+"</dl>";
 let h="<h2>Tu resumen</h2><div class='note'>Generado: "+F.fecha+"</div>"+sec("Datos",[["Nombre","nombre"],["Edad","edad"],["Sexo al nacer","sexo"]])+(F.nivel?"<div class='al "+(F.nivel.startsWith("Acudir")?"U":"R")+"'><b>Orientación:</b> "+e(F.nivel)+"</div>":"");
 if(F.alertas.length){h+="<h3>Puntos a tener en cuenta</h3>"+[...F.alertas].sort((a,b)=>(a.nivel!=="URGENTE")-(b.nivel!=="URGENTE")).map(a=>"<div class='al "+a.nivel[0]+"'>"+(a.nivel==="URGENTE"?"🔴":"🟡")+" ["+a.nivel+"] "+e(a.detalle)+"</div>").join("");if(F.decision)h+="<div class='note'>"+e(F.decision)+"</div>"}
 if(!F.interrumpido){
  h+=sec("Motivo de consulta",[["Relato","motivo"],["Lateralidad","lat"]])+sec("Síntomas dirigidos",[["Hipoacusia","hipo"],["Tinnitus","tin"],["Plenitud ótica","ple"],["Otorrea","otr"],["Otalgia","otal"],["Fiebre reciente","fie"]]);
  if(F.vtipo)h+=sec("Bloque vestibular",[["Tipo de mareo","vtipo"],["Duración","vdur"],["Frecuencia","vfrec"],["Desencadenantes","vdes"],["Náuseas / vómitos","vnau"]]);
  h+=sec("Evolución",[["Tiempo desde el inicio","ini"],["Inicio repentino","sub"]].concat(F.subd?[["Síntoma súbito","subd"]]:[]))+sec("Antecedentes y fármacos",[["Exposición a ruido","ruido"],["Infecciones frecuentes","inf"],["Cirugías óticas","cir"],["Familiares con hipoacusia","fam"],["Medicamentos","med"]])}
 const d=document.createElement("div");d.className="rep";d.innerHTML=h+"<p class='note'>Orientación general: no entrega diagnósticos ni reemplaza la evaluación de un médico. Cilia, by Rodrigo Jaque TM ORL.</p>";
 $("#log").append(d);d.scrollIntoView({behavior:"smooth"});
 const c=document.createElement("button");c.textContent="Copiar resumen";c.className="p";
 c.onclick=async()=>{try{await navigator.clipboard.writeText(d.innerText);c.textContent="Copiado"}catch(x){c.textContent="No se pudo copiar"}};
 const p=document.createElement("button");p.textContent="Imprimir / guardar PDF";p.onclick=()=>window.print();
 box.prepend(c,p)
}
run();
</script>
</body>
</html>
